    <script>
        // Configuration for the slideshow
        const config = {
        images: [
            "a.png", "aaa.png", "c.png", "ccc.png", "e.png", "ddd.png", "eee.png",
            "niam.png", "mak.png", "bulgarke.jpg", "zirk.jpg", "kaput.jpg", "kkk.png",
            "razinos.png", "melomano.png", "putos.png", "minkstimas.png", "sriuba.png",
            "image.png", "stiebai.png", "kilimamas.png", "agrastai.png", "Akmenukai.png",
            "New-Project.png"
        ],
        interval: 5000 // 3.5 seconds
    };
    
        // Slideshow logic
        const scrollContainer = document.querySelector('.scroll-container');
        let currentIndex = 0;
    
        function showNextImage() {
            // Move to the next image
            currentIndex = (currentIndex + 1) % config.images.length;
    
            // Update the scroll position
            scrollContainer.scrollTo({
                left: currentIndex * scrollContainer.offsetWidth,
                behavior: 'smooth'
            });
        }
    
        // Set up the interval for automatic scrolling
        setInterval(showNextImage, config.interval);
    </script>
